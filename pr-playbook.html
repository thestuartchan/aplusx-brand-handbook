B7 Dot Esports \xB7 Wirecutter (peripherals) \xB7 Engadget \xB7 PCWorld \xB7 regional gaming press in Korea, Japan, and EU",voice:"Friendly, explanatory, accessible. Matches Pulsar's social voice. Press materials read like the brand sounds. No spec-led pitches \u2014 Pulsar's PR explains what the product does for the player, not what the product is.",angles:[['"Inside the design of [Product]: how AplusX builds for the hand, not the spec sheet"',"Design philosophy feature."],['"[Pro Player] on what makes a mouse feel right"',"Partner-creator interview with technology context."],['"Why Pulsar ships in three shapes when most brands ship in one"',"Shape is King explainer."]]},{key:"es-pr",label:"Pulsar eS",color:l.pulsarEs,cadenceLabel:"3\u20135/quarter",tagline:"Restrained, technical, documentary \u2014 press materials read like a reference, not an announcement.",cadence:"3\u20135 placements per quarter. eS PR happens at readiness, not at calendar. Press releases are short, fact-led, and rare. eS does not chase coverage \u2014 coverage comes to eS through tournament moments and professional usage data.",pubs:"Dot Esports \xB7 HLTV.org \xB7 Liquipedia editorial \xB7 Dexerto \xB7 GosuGamers \xB7 ESPN Esports \xB7 tournament organizer media (ESL, BLAST, Riot) \xB7 specialist hardware verticals (Linus Tech Tips written, Optimum Tech, RTINGS for depth reviews)",voice:"Restrained, technical, documentary. Press materials read like a technical reference, not a marketing announcement. Specifications stated precisely. Tournament results documented. No adjectives that perform expertise \u2014 the expertise is in the precision.",angles:[['"[Player] wins [Tournament] using Pulsar eS [Product]"',"Tournament documentation, no marketing framing."],['"The QC process behind a tournament-grade mouse"',"Institutional credibility piece, technical depth."],['"PRO Series [Player]: built for the way they play"',"Documentary feature on the player and the product as a single story."]]},{key:"feinmann-pr",label:"Feinmann",color:l.feinmann,cadenceLabel:"2\u20134/quarter",tagline:"Editorial, considered, never promotional \u2014 press reads like a design publication, not a press release.",cadence:"2\u20134 placements per quarter. Editorial-led, not announcement-led. Feinmann PR works through earned editorial more than push releases. Coverage is sought through long lead times, relationship-led pitching, and meeting outlets in their own register.",pubs:"Wallpaper* \xB7 Monocle \xB7 T Magazine (NYT) \xB7 AD (Architectural Digest) \xB7 Dezeen \xB7 Hypebeast (when peer-tier collab justifies) \xB7 Hodinkee (timepiece adjacency) \xB7 Robb Report \xB7 How to Spend It (FT) \xB7 Apartamento \xB7 regional design press in Korea and Japan",voice:"Editorial, considered, never promotional. Press materials read like museum copy or a design publication's editorial. Names materials precisely. Avoids price as a topic. Treats the product as a cultural artifact, not a consumer purchase.",angles:[[`"[Material] in Feinmann's [Product]: where atelier methods meet input devices"`,"Craft and materials feature."],['"Feinmann \xD7 [Heritage Maker]: precision as a shared language"',"Peer-tier collaboration feature."],['"A new category at the table: the luxury input device"',"Category-defining editorial."]]},{key:"superglide-pr",label:"Superglide",color:l.superglide,cadenceLabel:"10\u201315/quarter",tagline:"Design-led, current, confident \u2014 same energy as social, visually-led press materials.",cadence:"10\u201315 placements per quarter, weighted heavily around collab seasons. Drops are press moments; off-cycle PR is opportunistic. Superglide's PR rhythm matches its drop rhythm \u2014 fast, visual, and culture-fluent.",pubs:"Hypebeast \xB7 Highsnobiety \xB7 Complex \xB7 Dezeen \xB7 It's Nice That \xB7 Sneaker Freaker (for collab features) \xB7 Dot Esports \xB7 gaming peripheral verticals \xB7 regional culture press \xB7 design newsletters and Substacks",voice:"Design-led, current, confident. Same energy as social. Press materials are visually led \u2014 the image leads, the copy plays support. Captions are short. The collab is named, the design is shown, and the story is in the visual.",angles:[['"Superglide \xD7 [Artist/Brand]: the drop that changes the desk"',"Collab feature."],['"The accessory that became a category"',"Superglide's role in mainstreaming setup culture."],['"Why glass mouse skates feel different \u2014 the materials story"',"Design-led product feature."]]},{key:"lab-pr",label:"Pulsar LAB",color:l.lab,cadenceLabel:"2\u20134/reveal",tagline:"Curious, honest about stage \u2014 press materials acknowledge what is in progress and what is not.",cadence:"2\u20134 placements per concept reveal. Most LAB drops have a press hook; concept reveals warrant a press moment of their own. PR is concept-led, not product-led \u2014 the question being asked is the story.",pubs:"Core77 \xB7 Yanko Design \xB7 Dezeen \xB7 Fast Company (innovation desk) \xB7 Wired (product) \xB7 MIT Technology Review (when relevant) \xB7 AplusX-credited features in business and industrial press \xB7 regional design and innovation press",voice:"Curious, honest about stage. Same as social. Press materials acknowledge what is in progress and what is not. 'We are trying' is more useful than 'we are launching.' LAB does not pitch finished products \u2014 it pitches questions, processes, and provisional answers.",angles:[[`"Inside Pulsar LAB: what AplusX is trying that didn't fit anywhere else"`,"Exploratory feature."],['"From LAB to product: how [past concept] became [shipping product]"',"Concept-to-graduation case study."],[`"The honest experiment: LAB's stance on shipping work in progress"`,"Process and philosophy feature."]]},{key:"aplusx-pr",label:"AplusX corporate",color:l.aplusx,cadenceLabel:"4\u20138/year",tagline:"Institutional, factual \u2014 AplusX speaks as the company, not as a brand. No marketing tone.",cadence:"Event-driven. Typically 4\u20138 placements per year on company-level stories. Earnings, leadership moves, and manufacturing announcements trigger additional cycles. AplusX corporate PR does not run continuously \u2014 it speaks when the company has something institutional to say.",pubs:"Bloomberg \xB7 Reuters \xB7 Nikkei \xB7 Korea Economic Daily \xB7 Korea Times Business \xB7 Financial Times (Asia desk) \xB7 Wall Street Journal (tech and manufacturing) \xB7 Forbes \xB7 Fortune \xB7 regional industrial press",voice:"Institutional, factual. AplusX speaks as the company, not as a brand. No marketing tone. The audience is investors, talent, government, retail and distribution partners, and the press \u2014 never gamers.",angles:[['"AplusX: the Korean manufacturing company behind the gaming peripheral category"',"Parent-narrative feature."],['"How a single manufacturer became the parent of three category-defining brands"',"Portfolio strategy story."],['"Earnings and financial performance coverage"',"Manufacturing partnership announcements, leadership profiles."]]}];function C(){m(()=>{let i="aplusx-fonts";if(!document.getElementById(i)){let r=document.createElement("link");r.id=i,r.rel="stylesheet",r.href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap",document.head.appendChild(r)}let o=document.querySelector('meta[name="color-scheme"]');o||(o=document.createElement("meta"),o.name="color-scheme",document.head.appendChild(o)),o.content="light"},[]);let t=i=>document.getElementById(i)?.scrollIntoView({behavior:"smooth"});return e.createElement("div",{style:{...s,background:l.surface,color:l.ink,minHeight:"100vh",WebkitFontSmoothing:"antialiased",colorScheme:"light"}},e.createElement("header",{style:{position:"sticky",top:0,zIndex:50,background:"rgba(250, 250, 247, 0.94)",backdropFilter:"saturate(180%) blur(12px)",WebkitBackdropFilter:"saturate(180%) blur(12px)",borderBottom:`1px solid ${l.faint}`}},e.createElement("div",{style:{maxWidth:11
